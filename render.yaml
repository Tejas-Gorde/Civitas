services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Service
  # ---------------------------------------------------------------------------
  - type: web
    name: civitas-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://civitas-frontend.onrender.com,https://civitas-frontend-nvp6.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: civitas-db
          property: connectionString

  # ---------------------------------------------------------------------------
  # 2. Next.js Frontend Service
  # ---------------------------------------------------------------------------
  - type: web
    name: civitas-frontend
    runtime: node
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    startCommand: "npm start"
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NEXT_PUBLIC_API_URL
        value: "/api/v1"
      - key: BACKEND_URL
        fromService:
          type: web
          name: civitas-backend
          property: host

databases:
  # ---------------------------------------------------------------------------
  # 3. Managed PostgreSQL Database (Persistent Free Tier)
  # ---------------------------------------------------------------------------
  - name: civitas-db
    databaseName: civitas
    user: civitas_user
    plan: free
