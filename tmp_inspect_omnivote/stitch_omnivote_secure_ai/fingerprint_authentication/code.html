,"lg":"2.5rem"},"fontFamily":{"body-lg":["Inter"],"headline-lg-mobile":["Inter"],"label-md":["Inter"],"label-sm":["Inter"],"display-lg":["Inter"],"body-md":["Inter"],"headline-md":["Inter"],"headline-lg":["Inter"]},"fontSize":{"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}],"headline-lg-mobile":["24px",{"lineHeight":"32px","fontWeight":"600"}],"label-md":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"500"}],"label-sm":["12px",{"lineHeight":"16px","letterSpacing":"0.05em","fontWeight":"600"}],"display-lg":["48px",{"lineHeight":"56px","letterSpacing":"-0.02em","fontWeight":"700"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"headline-md":["24px",{"lineHeight":"32px","fontWeight":"600"}],"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.01em","fontWeight":"600"}]}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"></head><body class="bg-background font-body-md text-on-background"><main class="w-full flex items-center justify-center min-h-screen p-gutter bg-surface-container-lowest"><div class="flex flex-col w-full h-full items-center justify-center py-20 relative overflow-hidden">
<div class="absolute inset-0 pointer-events-none opacity-20 flex justify-center items-center">
<div class="w-[800px] h-[800px] bg-primary rounded-full blur-[150px] mix-blend-multiply opacity-50 animate-pulse"></div>
</div>
<div class="max-w-[480px] w-full bg-surface-container-lowest rounded-3xl shadow-xl p-10 flex flex-col items-center relative z-10 transition-all duration-500 ease-in-out transform hover:scale-[1.01]">
<div class="w-full flex justify-between items-center mb-12">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary">lock</span>
<span class="font-label-sm text-label-sm text-tertiary uppercase tracking-wider">Secure Step 2 of 4</span>
</div>
<div class="flex gap-1">
<div class="w-8 h-1 rounded-full bg-primary"></div>
<div class="w-8 h-1 rounded-full bg-primary"></div>
<div class="w-8 h-1 rounded-full bg-surface-variant"></div>
<div class="w-8 h-1 rounded-full bg-surface-variant"></div>
</div>
</div>
<div class="text-center mb-10">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Biometric Verification</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please place your registered finger on the sensor to confirm your identity securely.</p>
</div>
<div class="relative w-48 h-48 mb-12 cursor-pointer group" id="fingerprint-container">
<div class="absolute inset-0 bg-primary/5 rounded-full scale-110 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-40 h-40 bg-surface-container rounded-full flex items-center justify-center shadow-inner overflow-hidden">
<svg class="w-24 h-24 text-outline-variant transition-colors duration-300" fill="none" id="fingerprint-icon" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</svg>
<div class="absolute top-0 left-0 w-full h-[4px] bg-primary shadow-[0_0_15px_rgba(53,37,205,0.8)] -translate-y-[100%]" id="scanner-line"></div>
<div class="absolute inset-0 bg-primary/10 mix-blend-overlay opacity-0" id="scan-overlay"></div>
</div>
<div class="absolute inset-0 pointer-events-none rounded-full flex items-center justify-center scale-[1.3] opacity-0" id="success-ring">
<svg class="w-full h-full text-primary" viewBox="0 0 100 100">
<circle cx="50" cy="50" fill="none" id="success-circle" r="48" stroke="currentColor" stroke-dasharray="301" stroke-dashoffset="301" stroke-width="2"></circle>
</svg>
</div>
</div>
<div class="h-8 flex items-center justify-center mb-10 w-full">
<span class="font-label-md text-label-md text-on-surface-variant transition-opacity duration-300" id="status-text">Awaiting scan...</span>
</div>
<button class="w-full h-14 bg-primary text-on-primary font-label-md text-label-md rounded-xl shadow-md hover:shadow-lg transition-all duration-300 opacity-50 pointer-events-none flex items-center justify-center gap-2 translate-y-4" id="continue-btn">
      Continue to Election
      <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<button class="mt-6 font-label-md text-label-md text-secondary hover:text-primary transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">passkey</span>
      Use Another Verification Method
    </button>
</div>
<div class="mt-12 flex items-center gap-4 bg-surface-container-low px-6 py-3 rounded-full shadow-sm z-10">
<span class="material-symbols-outlined text-primary text-[20px]">verified_user</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wide">End-to-End Encrypted</span>
<div class="w-[1px] h-4 bg-outline-variant"></div>
<span class="material-symbols-outlined text-primary text-[20px]">fingerprint</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wide">Biometric Match</span>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('fingerprint-container');
    const scannerLine = document.getElementById('scanner-line');
    const fingerprintIcon = document.getElementById('fingerprint-icon');
    const statusText = document.getElementById('status-text');
    const continueBtn = document.getElementById('continue-btn');
    const scanOverlay = document.getElementById('scan-overlay');
    const successRing = document.getElementById('success-ring');
    const successCircle = document.getElementById('success-circle');

    let isScanning = false;

    container.addEventListener('click', () => {
      if (isScanning) return;
      isScanning = true;

      // Scanning State
      statusText.textContent = "Scanning biometrics...";
      statusText.classList.remove('text-on-surface-variant');
      statusText.classList.add('text-primary');
      
      fingerprintIcon.classList.remove('text-outline-variant');
      fingerprintIcon.classList.add('text-primary');
      
      scanOverlay.classList.remove('opacity-0');
      scanOverlay.classList.add('opacity-100');

      // Scanner Animation
      scannerLine.animate([
        { transform: 'translateY(-10px)' },
        { transform: 'translateY(160px)' },
        { transform: 'translateY(-10px)' }
      ], {
        duration: 2000,
        easing: 'ease-in-out',
        iterations: 2
      }).onfinish = () => {
        // Processing State
        statusText.textContent = "Verifying match...";
        scannerLine.style.opacity = '0';
        
        setTimeout(() => {
          // Verified State
          statusText.textContent = "Fingerprint Match Successful ✓";
          statusText.classList.remove('text-primary');
          statusText.classList.add('text-primary-container');
          
          fingerprintIcon.classList.remove('text-primary');
          fingerprintIcon.classList.add('text-primary-container');
          
          scanOverlay.classList.remove('opacity-100');
          scanOverlay.classList.add('opacity-0');
          
          successRing.classList.remove('opacity-0');
          successRing.classList.add('opacity-100');
          
          successCircle.animate([
            { strokeDashoffset: 301 },
            { strokeDashoffset: 0 }
          ], {
            duration: 600,
            easing: 'ease-out',
            fill: 'forwards'
          });

          // Enable Button
          continueBtn.classList.remove('opacity-50', 'pointer-events-none', 'translate-y-4');
          continueBtn.classList.add('opacity-100', 'translate-y-0');
        }, 1200);
      };
    });
  });
</script></main></body></html>
